name: Diagnose server
# re-run to check why /run produced no scenarios

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/new-session-zodz7e
    paths:
      - .github/workflows/diagnose.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Show container status and logs
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            cd /opt/movirevo
            echo "=== docker compose ps ==="
            docker compose ps
            echo "=== docker compose logs (last 100 lines, no getUpdates noise) ==="
            docker compose logs --tail 2000 | grep -v "getUpdates" | tail -150
            echo "=== connectivity: host -> api.telegram.org ==="
            curl -sS -o /dev/null -w "http_code=%{http_code} time=%{time_total}s\n" --max-time 10 https://api.telegram.org || echo "host curl FAILED: $?"
            echo "=== connectivity: bot container (host network) -> api.telegram.org ==="
            docker compose exec -T bot python3 -c "import urllib.request,time; t=time.time(); urllib.request.urlopen(\"https://api.telegram.org\", timeout=10); print(\"OK\", time.time()-t)" || echo "container curl FAILED"
          '
