services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # From this network, api.telegram.org only resolves to an AAAA (IPv6)
    # record — no A record at all (likely IPv6-only DNS as an anti-block
    # measure). The host has real outbound IPv6 and reaches it fine; the
    # default Docker bridge network does not get an IPv6 route/address at
    # all, so the container can't use that address (Network unreachable).
    # host networking gives the container the exact same IPv6 path the
    # host already has, instead of fighting to set up IPv6 NAT in Docker.
    # Bot only makes outbound connections (no listening port), so this is
    # safe alongside other services already running on the host.
    network_mode: host
    volumes:
      - ./photos:/app/photos
      - ./output:/app/output
      - ./state.json:/app/state.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
